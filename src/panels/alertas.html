<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alertas · Larrs</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f7; color: #1e293b; padding: 14px; font-size: 14px; }
.container { max-width: 820px; margin: 0 auto; }
.header { background: linear-gradient(135deg, #111418, #1e293b); border-radius: 12px; padding: 18px 22px; margin-bottom: 12px; color: #fff; }
.logo-img { height: 44px; width: auto; display: block; }
.header .title { font-size: 15px; font-weight: 700; color: #e2e8f0; margin-top: 10px; }
.header .subtitle { font-size: 12px; color: #94a3b8; margin-top: 2px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; }
.kpi .n { font-size: 24px; font-weight: 800; }
.kpi .n.alta { color: #b91c1c; }
.kpi .n.media { color: #b45309; }
.kpi .lbl { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.barra { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.btn { font-size: 12px; font-weight: 700; border: 1px solid #e2e8f0; background: #fff; color: #334155; border-radius: 8px; padding: 8px 13px; cursor: pointer; }
.btn-primary { background: #1e293b; border-color: #1e293b; color: #fff; }
.btn:disabled { opacity: .55; }
.tenue { font-size: 11px; color: #94a3b8; }
.tienda { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.tienda h2 { font-size: 13px; padding: 11px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
.a { padding: 11px 14px; border-top: 1px solid #f1f5f9; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
.a:first-child { border-top: 0; }
.punto { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.punto.alta { background: #dc2626; }
.punto.media { background: #f59e0b; }
.tipo { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; }
.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; border-radius: 10px; padding: 16px; font-size: 14px; }
.warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 8px; padding: 10px 13px; font-size: 12px; margin-bottom: 12px; line-height: 1.5; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="/larrs-logo.png" alt="Larrs" class="logo-img">
    <div class="title">Alertas</div>
    <div class="subtitle">Lo que está fuera de lugar ahora mismo en las tres tiendas</div>
  </div>

  <div id="aviso-fuentes"></div>
  <div class="kpis" id="kpis"></div>

  <div class="barra">
    <button class="btn btn-primary" id="btn-recalcular" onclick="cargar(true)">↻ Recalcular ahora</button>
    <button class="btn" onclick="copiar()" id="btn-copiar">📋 Copiar para WhatsApp</button>
    <span class="tenue" id="cuando"></span>
  </div>

  <div id="lista"><div class="tienda"><div class="a">Cargando…</div></div></div>
</div>

<script>
let datos = null;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NOMBRE_TIPO = { vitrina: 'vitrina', stock: 'stock', produccion: 'producción', sin_registrar: 'registros', asistencia: 'equipo' };

async function cargar(recalcular) {
  const btn = document.getElementById('btn-recalcular');
  btn.disabled = true;
  if (recalcular) {
    btn.textContent = 'Recalculando… medio minuto';
    document.getElementById('lista').innerHTML = '<div class="tienda"><div class="a">Cruzando producción, stock, vitrinas y asistencia…</div></div>';
  }
  try {
    const resp = await fetch('/api/alertas' + (recalcular ? '?recalcular=1' : ''));
    const texto = await resp.text();
    let d;
    try { d = JSON.parse(texto); }
    catch { throw new Error(`el servidor respondió ${resp.status} sin datos.`); }
    if (!d.ok) throw new Error(d.error || 'No se pudieron cargar las alertas');
    datos = d;
    render();
  } catch (e) {
    document.getElementById('lista').innerHTML = `<div class="tienda"><div class="a">Error: ${esc(e.message)}</div></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '↻ Recalcular ahora';
  }
}

function render() {
  const d = datos;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="n ${d.altas ? 'alta' : ''}">${d.altas}</div><div class="lbl">Urgentes</div></div>
    <div class="kpi"><div class="n ${d.medias ? 'media' : ''}">${d.medias}</div><div class="lbl">Para mirar</div></div>`;

  document.getElementById('cuando').textContent = d.hace ? `Calculado ${d.hace}` : '';

  // Si una fuente no se pudo leer, sus alertas no existen: decirlo evita que
  // "sin alertas" se lea como "todo en orden".
  document.getElementById('aviso-fuentes').innerHTML = (d.fuentesQueFallaron || []).length
    ? `<div class="warn"><b>Ojo:</b> no se pudo leer ${esc(d.fuentesQueFallaron.join('; '))}. Puede haber alertas de esas fuentes que no están en esta lista.</div>`
    : '';

  if (!d.alertas.length) {
    document.getElementById('lista').innerHTML = '<div class="ok">Sin alertas: las tres tiendas están produciendo, registrando y con la vitrina al día.</div>';
    return;
  }

  const porTienda = {};
  for (const a of d.alertas) (porTienda[a.tienda] = porTienda[a.tienda] || []).push(a);

  document.getElementById('lista').innerHTML = Object.entries(porTienda).map(([tienda, as]) => {
    const altas = as.filter((a) => a.gravedad === 'alta').length;
    return `<div class="tienda">
      <h2>${esc(tienda)} <span class="tenue">· ${as.length} alerta(s)${altas ? `, ${altas} urgente(s)` : ''}</span></h2>
      ${as.map((a) => `<div class="a">
        <span class="punto ${a.gravedad}"></span>
        <div><div class="tipo">${esc(NOMBRE_TIPO[a.tipo] || a.tipo)}</div>${esc(a.mensaje)}</div>
      </div>`).join('')}
    </div>`;
  }).join('');
}

function copiar() {
  if (!datos) return;
  const lineas = [`*Alertas Larrs* — ${new Date().toLocaleDateString('es-CL')}`, ''];
  const porTienda = {};
  for (const a of datos.alertas) (porTienda[a.tienda] = porTienda[a.tienda] || []).push(a);
  for (const [tienda, as] of Object.entries(porTienda)) {
    lineas.push(`*${tienda}*`);
    for (const a of as) lineas.push(`${a.gravedad === 'alta' ? '🔴' : '🟡'} ${a.mensaje}`);
    lineas.push('');
  }
  const texto = lineas.join('\n').trim();
  const btn = document.getElementById('btn-copiar');
  navigator.clipboard.writeText(texto).then(() => {
    btn.textContent = '✓ Copiado';
    setTimeout(() => { btn.textContent = '📋 Copiar para WhatsApp'; }, 2500);
  }).catch(() => window.prompt('Copiá las alertas:', texto));
}

cargar(false);
</script>
</body>
</html>
