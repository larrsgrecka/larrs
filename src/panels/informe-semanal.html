<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe semanal · Larrs</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f7; color: #1e293b; padding: 14px; font-size: 14px; }
.container { max-width: 900px; margin: 0 auto; }
.header { background: linear-gradient(135deg, #111418, #1e293b); border-radius: 12px; padding: 18px 22px; margin-bottom: 12px; color: #fff; }
.logo-img { height: 44px; width: auto; display: block; }
.header .title { font-size: 15px; font-weight: 700; color: #e2e8f0; margin-top: 10px; }
.header .subtitle { font-size: 12px; color: #94a3b8; margin-top: 2px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; }
.kpi .n { font-size: 22px; font-weight: 800; }
.kpi .lbl { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.n.baja { color: #b91c1c; } .n.sube { color: #15803d; }
.seccion { font-size: 11px; font-weight: 700; color: #334155; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 8px; }
.alerta { border-radius: 8px; padding: 10px 13px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; border: 1px solid; }
.alerta.alta { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
.alerta.media { background: #fffbeb; border-color: #fde68a; color: #92400e; }
.alerta b { font-weight: 800; }
.sin-alertas { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; border-radius: 8px; padding: 12px 14px; font-size: 13px; }
.tienda { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.tienda h3 { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
.tienda .dato { font-size: 13px; color: #334155; margin-top: 7px; line-height: 1.55; }
.tienda .dato b { font-weight: 700; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; margin-left: 6px; }
.chip.baja { background: #fef2f2; color: #b91c1c; } .chip.sube { background: #f0fdf4; color: #15803d; } .chip.igual { background: #f1f5f9; color: #64748b; }
.tenue { color: #94a3b8; font-size: 12px; }
.aviso { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 8px; padding: 10px 13px; font-size: 12px; margin-bottom: 12px; line-height: 1.5; }
.empty { padding: 26px; text-align: center; color: #94a3b8; }
.btn { font-size: 12px; font-weight: 700; border: 1px solid #e2e8f0; background: #f8fafc; color: #334155; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
@media print {
  @page { size: A4 portrait; margin: 12mm; }
  body { background: #fff; padding: 0; }
  .header { background: #fff !important; color: #1e293b; padding: 0 0 8px; border-radius: 0; }
  .header .title { color: #1e293b; font-size: 16px; } .header .subtitle { color: #475569; }
  .logo-img { height: 30px; filter: invert(1); }
  .btn, #acciones { display: none !important; }
  .tienda, .alerta, .kpi { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img class="logo-img" src="https://heladerialarrs.cl/cdn/shop/t/2/assets/logo-footer.png?v=41616879924709803011609269083" alt="Larrs">
    <div class="title">Informe semanal</div>
    <div class="subtitle" id="subtitulo">Cargando...</div>
  </div>

  <div id="contenido"><div class="card"><div class="empty">Armando el informe… puede tardar unos segundos.</div></div></div>

  <div id="acciones" style="display:none;margin-bottom:10px">
    <button class="btn" onclick="window.print()">🖨 Imprimir o guardar PDF</button>
    <button class="btn" onclick="cargar()">↻ Actualizar</button>
    <!-- Mirado un martes, el informe de la semana cerrada parece decir que
         nadie registró nada: lo de ayer y hoy todavía no entra. Este botón
         muestra la semana que está pasando. -->
    <button class="btn" id="btn-semana" onclick="cambiarSemana()">📅 Ver la semana en curso</button>
  </div>
  <div class="tenue" id="pie" style="text-align:center"></div>
</div>

<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function chipVariacion(pct) {
  if (pct === null || pct === undefined) return '';
  const clase = pct <= -10 ? 'baja' : pct >= 10 ? 'sube' : 'igual';
  return `<span class="chip ${clase}">${pct > 0 ? '+' : ''}${pct}% vs semana previa</span>`;
}

function render(inf) {
  document.getElementById('subtitulo').textContent =
    `Semana del ${inf.semana.etiqueta} · comparada con ${inf.semanaPrevia.etiqueta}` +
    (inf.semana.etiqueta.includes('en curso') ? ' · va hasta hoy, así que los totales todavía no están completos' : '');

  const r = inf.resumen;
  const claseTotal = r.variacionPct === null ? '' : r.variacionPct <= -10 ? 'baja' : r.variacionPct >= 10 ? 'sube' : '';

  const alertas = inf.alertas.length
    ? inf.alertas.map(a => `<div class="alerta ${esc(a.gravedad)}"><b>${esc(a.tienda)}</b> — ${esc(a.mensaje)}</div>`).join('')
    : `<div class="sin-alertas">Ninguna señal rara esta semana: todas las tiendas registraron, la producción se mantuvo y no hay ausencias sin justificar.</div>`;

  const aviso = inf.fuentesQueFallaron.length
    ? `<div class="aviso"><b>Ojo:</b> no se pudieron leer ${inf.fuentesQueFallaron.length === 1 ? 'una fuente' : 'algunas fuentes'} al armar el informe, así que esa parte va en blanco y no cuenta como "sin problemas":<br>${inf.fuentesQueFallaron.map(f => '· ' + esc(f)).join('<br>')}</div>`
    : '';

  const tiendas = inf.tiendas.map(t => {
    const p = t.produccion, s = t.stock, e = t.equipo;
    const top = p.topSabores.length
      ? p.topSabores.map(x => `${esc(x.sabor)} (${x.kg} kg)`).join(' · ')
      : '<span class="tenue">sin producción registrada</span>';
    const stockTxt = s.bajoMinimo === null
      ? '<span class="tenue">sin datos (falló la lectura)</span>'
      : `<b>${s.bajoMinimo}</b> productos bajo el mínimo, faltan <b>${s.unidadesQueFaltan}</b> unidades` +
        (s.masUrgentes.length ? `<br><span class="tenue">Lo que más falta: ${s.masUrgentes.map(x => `${esc(x.producto)} (${x.falta})`).join(' · ')}</span>` : '');
    const pendientes = t.registros.filter(x => x.sinDatos || x.dias === null || x.dias >= 3);
    const registrosTxt = pendientes.length
      ? pendientes.map(x => x.sinDatos ? `${esc(x.modulo)}: <span class="tenue">sin datos</span>`
          : x.dias === null ? `${esc(x.modulo)}: <b>nunca</b>` : `${esc(x.modulo)}: hace <b>${x.dias}</b> días`).join(' · ')
      : 'todos los módulos al día';

    return `<div class="tienda">
      <h3>${esc(t.tienda)}</h3>
      <div class="dato">Produjo <b>${p.kg} kg</b> en <b>${p.diasConProduccion}</b> día(s) ${chipVariacion(p.variacionPct)}</div>
      <div class="dato">Más producido: ${top}</div>
      <div class="dato">Stock: ${stockTxt}</div>
      <div class="dato">Equipo: <b>${esc(e.horasTrabajadas || '—')}</b>${e.personas ? ` (${e.personas} personas)` : ''} · atrasos: <b>${esc(e.atrasoAcumulado)}</b>${e.ausenciasSinJustificar ? ` · <b>${e.ausenciasSinJustificar}</b> ausencia(s) sin justificar` : ''}</div>
      <div class="dato">Registros: ${registrosTxt}</div>
    </div>`;
  }).join('');

  document.getElementById('contenido').innerHTML = `
    ${aviso}
    <div class="resumen">
      <div class="kpi"><div class="n ${claseTotal}">${r.totalKg} kg</div><div class="lbl">Producido en la semana</div></div>
      <div class="kpi"><div class="n">${r.totalKgSemanaPrevia} kg</div><div class="lbl">Semana anterior</div></div>
      <div class="kpi"><div class="n ${r.alertasAltas ? 'baja' : ''}">${r.alertasAltas}</div><div class="lbl">Señales importantes</div></div>
      <div class="kpi"><div class="n">${r.alertasMedias}</div><div class="lbl">Para mirar</div></div>
    </div>
    <div class="seccion">Lo que hay que mirar</div>
    ${alertas}
    <div class="seccion">Tienda por tienda</div>
    ${tiendas}`;

  document.getElementById('acciones').style.display = 'block';
  document.getElementById('pie').textContent = `Generado: ${new Date(inf.generadoEn).toLocaleString('es-CL')}`;
}

let semanaVista = 'cerrada';

function cambiarSemana() {
  semanaVista = semanaVista === 'cerrada' ? 'en-curso' : 'cerrada';
  cargar();
}

async function cargar() {
  document.getElementById('contenido').innerHTML =
    '<div class="card"><div class="empty">Armando el informe… puede tardar unos segundos.</div></div>';
  const btn = document.getElementById('btn-semana');
  if (btn) btn.textContent = semanaVista === 'cerrada' ? '📅 Ver la semana en curso' : '📅 Ver la semana cerrada';
  try {
    const resp = await fetch('/api/informe-semanal?semana=' + semanaVista);
    const texto = await resp.text();
    let data;
    try { data = JSON.parse(texto); }
    catch { throw new Error(`el servidor respondió ${resp.status} sin datos. Vuelve a intentar en unos segundos.`); }
    if (!data.ok) throw new Error(data.error || 'Error al generar el informe');
    render(data);
  } catch (e) {
    document.getElementById('contenido').innerHTML =
      `<div class="card"><div class="empty">Error: ${esc(e.message)}</div></div>`;
  }
}

cargar();
</script>
</body>
</html>
